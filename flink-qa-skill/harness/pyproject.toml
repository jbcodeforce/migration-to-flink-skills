[project]
name = "flink-qa-agent"
version = "0.1.0"
description = "Agent to support user queries on Flink"
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.0.0",
    "confluent-sql>=0.3.1",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "sqlglot>=26.0.0",
]

[project.scripts]
flink-qa= "flink_qa_agent:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
    "integration: tests requiring live Confluent Cloud Flink credentials",
    "integration_agent: integration tests requiring reachable LLM for agent",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests", "tests/it"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]
